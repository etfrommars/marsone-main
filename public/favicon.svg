<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="marsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0df2c9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#05080f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="marsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ff5d0" />
      <stop offset="50%" stop-color="#00c8a2" />
      <stop offset="100%" stop-color="#006654" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6fff8" />
      <stop offset="40%" stop-color="#5cf2d5" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="neonTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#050c14" stroke="url(#marsBorder)" stroke-width="2" />
  <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#marsGlow)" />

  <!-- Corner tech accents -->
  <path d="M 12 8 L 8 8 L 8 12" stroke="#0df2c9" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 52 8 L 56 8 L 56 12" stroke="#0df2c9" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 8 52 L 8 56 L 12 56" stroke="#0df2c9" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 56 52 L 56 56 L 52 56" stroke="#0df2c9" stroke-width="1.5" stroke-linecap="round" />

  <!-- Orbit subtle ring -->
  <circle cx="32" cy="32" r="22" stroke="#00f0ff" stroke-width="0.75" stroke-dasharray="2 3" stroke-opacity="0.3" />

  <!-- MARS Text Logo - perfectly scaled to sit comfortably inside the box with ample margin -->
  <text x="32" y="34" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="11" 
        letter-spacing="1.5"
        fill="url(#textGrad)"
        filter="url(#neonTextGlow)">MARS</text>

  <!-- Subtitle ONE -->
  <text x="32" y="43" 
        text-anchor="middle" 
        font-family="monospace" 
        font-weight="700" 
        font-size="7" 
        letter-spacing="2"
        fill="#0df2c9"
        fill-opacity="0.85">ONE</text>

  <!-- Cybernetic indicator line & dot -->
  <line x1="22" y1="48" x2="42" y2="48" stroke="#0df2c9" stroke-width="1" stroke-opacity="0.6" />
  <circle cx="32" cy="48" r="1.2" fill="#00f0ff" />
</svg>
