<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="alienGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0df2c9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#05080f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ff5d0" />
      <stop offset="45%" stop-color="#04b896" />
      <stop offset="100%" stop-color="#013b30" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#001815" />
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0df2c9" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with deep space dark -->
  <circle cx="32" cy="32" r="30" fill="#060b14" stroke="#0df2c9" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="32" cy="32" r="28" fill="url(#alienGlow)" />

  <!-- Outer orbital quantum ring -->
  <circle cx="32" cy="32" r="25" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="3 4" stroke-opacity="0.5" />

  <!-- Alien Head Outline / Shape -->
  <path d="M 32 8 C 18 8 12 18 12 28 C 12 40 24 53 30 55 C 31 55.3 33 55.3 34 55 C 40 53 52 40 52 28 C 52 18 46 8 32 8 Z" 
        fill="url(#headGrad)" 
        stroke="#0df2c9" 
        stroke-width="1.8" 
        filter="url(#neonBlur)" />

  <!-- Subtle forehead cybernetic node -->
  <circle cx="32" cy="16" r="1.5" fill="#00f0ff" />
  <line x1="32" y1="18" x2="32" y2="23" stroke="#0df2c9" stroke-width="1" stroke-opacity="0.7" />

  <!-- Left Alien Eye (Large Almond-shaped, tilted) -->
  <path d="M 18 29 C 18 24 25 24 28 31 C 29 34 26 38 21 38 C 18 38 18 33 18 29 Z" 
        fill="url(#eyeGrad)" 
        stroke="url(#eyeGlow)" 
        stroke-width="1.2" />
  <!-- Left Eye Iris / Glow pupil reflection -->
  <ellipse cx="24" cy="31" rx="2.5" ry="4" transform="rotate(-25 24 31)" fill="#00f0ff" opacity="0.8" />
  <ellipse cx="23" cy="30" rx="0.8" ry="1.5" fill="#ffffff" opacity="0.9" />

  <!-- Right Alien Eye (Large Almond-shaped, tilted) -->
  <path d="M 46 29 C 46 24 39 24 36 31 C 35 34 38 38 43 38 C 46 38 46 33 46 29 Z" 
        fill="url(#eyeGrad)" 
        stroke="url(#eyeGlow)" 
        stroke-width="1.2" />
  <!-- Right Eye Iris / Glow pupil reflection -->
  <ellipse cx="40" cy="31" rx="2.5" ry="4" transform="rotate(25 40 31)" fill="#00f0ff" opacity="0.8" />
  <ellipse cx="41" cy="30" rx="0.8" ry="1.5" fill="#ffffff" opacity="0.9" />

  <!-- Minimalist Nostril slits & chin taper -->
  <ellipse cx="30.5" cy="44" rx="0.7" ry="1.2" fill="#013b30" />
  <ellipse cx="33.5" cy="44" rx="0.7" ry="1.2" fill="#013b30" />
  
  <!-- Subtle mouth line -->
  <path d="M 29.5 48 Q 32 49 34.5 48" stroke="#013b30" stroke-width="0.8" stroke-linecap="round" />
</svg>
